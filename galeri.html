<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Galeri — ANANTA.NET</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div data-site-header></div>

  <section class="page-hero">
    <div class="container page-hero-inner">
      <div class="breadcrumb">Home / Galeri</div>
      <h1>Galeri</h1>
      <p style="margin:0;color:var(--muted)">Dokumentasi perangkat dan jaringan yang digunakan.</p>
    </div>
  </section>

  <main>
    <section class="section">
      <div class="container">
        <div class="section-head gallery-section-head">
          <div>
            <div class="eyebrow">Dokumentasi ANANTA.NET</div>
            <h2 style="margin:0">Instalasi & perangkat di lapangan</h2>
          </div>
          <p style="margin:0;color:var(--muted);max-width:560px">Klik foto untuk melihat ukuran penuh.</p>
        </div>

        <div class="filters" aria-label="Filter galeri">
          <button class="filter-btn active" data-filter="all">Semua</button>
          <button class="filter-btn" data-filter="installation">Instalasi</button>
          <button class="filter-btn" data-filter="network">Perangkat Jaringan</button>
          <button class="filter-btn" data-filter="cable">Kabel</button>
          <button class="filter-btn" data-filter="customer">Perangkat Pelanggan</button>
        </div>

        <div class="gallery-grid gallery-grid-refined">
          <figure class="gallery-item gallery-item-refined" data-gallery-item data-cat="installation" tabindex="0" role="button" aria-label="Buka foto instalasi 1">
            <img src="assets/gallery/instalasi-kabel-1.jpeg" alt="Teknisi melakukan instalasi jaringan di tiang" data-gallery-src="assets/gallery/instalasi-kabel-1.jpeg" data-gallery-title="Instalasi Jaringan">
            <figcaption class="gallery-caption">Instalasi Jaringan</figcaption>
          </figure>

          <figure class="gallery-item gallery-item-refined" data-gallery-item data-cat="installation" tabindex="0" role="button" aria-label="Buka foto instalasi 2">
            <img src="assets/gallery/instalasi-kabel-2.jpeg" alt="Teknisi melakukan instalasi jaringan di lapangan" data-gallery-src="assets/gallery/instalasi-kabel-2.jpeg" data-gallery-title="Instalasi Jaringan">
            <figcaption class="gallery-caption">Instalasi Jaringan</figcaption>
          </figure>

          <figure class="gallery-item gallery-item-refined" data-gallery-item data-cat="installation" tabindex="0" role="button" aria-label="Buka foto instalasi 3">
            <img src="assets/gallery/instalasi-kabel-3.jpeg" alt="Teknisi melakukan pemasangan jaringan di rumah pelanggan" data-gallery-src="assets/gallery/instalasi-kabel-3.jpeg" data-gallery-title="Instalasi Jaringan">
            <figcaption class="gallery-caption">Instalasi Jaringan</figcaption>
          </figure>

          <figure class="gallery-item gallery-item-refined" data-gallery-item data-cat="network" tabindex="0" role="button" aria-label="Buka foto perangkat jaringan 1">
            <img src="assets/gallery/doc_image_2.jpeg" alt="Perangkat jaringan ANANTA.NET" data-gallery-src="assets/gallery/doc_image_2.jpeg" data-gallery-title="Perangkat Jaringan">
            <figcaption class="gallery-caption">Perangkat Jaringan</figcaption>
          </figure>

          <figure class="gallery-item gallery-item-refined" data-gallery-item data-cat="network" tabindex="0" role="button" aria-label="Buka foto perangkat jaringan 2">
            <img src="assets/gallery/doc_image_3.jpeg" alt="Perangkat jaringan ANANTA.NET" data-gallery-src="assets/gallery/doc_image_3.jpeg" data-gallery-title="Perangkat Jaringan">
            <figcaption class="gallery-caption">Perangkat Jaringan</figcaption>
          </figure>

          <figure class="gallery-item gallery-item-refined" data-gallery-item data-cat="network" tabindex="0" role="button" aria-label="Buka foto ONT dan router">
            <img src="assets/gallery/doc_image_4.png" alt="ONT dan router" data-gallery-src="assets/gallery/doc_image_4.png" data-gallery-title="ONT dan Router">
            <figcaption class="gallery-caption">ONT &amp; Router</figcaption>
          </figure>

          <figure class="gallery-item gallery-item-refined" data-gallery-item data-cat="cable" tabindex="0" role="button" aria-label="Buka foto kabel jaringan">
            <img src="assets/gallery/doc_image_5.png" alt="Kabel jaringan" data-gallery-src="assets/gallery/doc_image_5.png" data-gallery-title="Kabel Jaringan">
            <figcaption class="gallery-caption">Kabel Jaringan</figcaption>
          </figure>

          <figure class="gallery-item gallery-item-refined" data-gallery-item data-cat="customer" tabindex="0" role="button" aria-label="Buka foto perangkat pelanggan 1">
            <img src="assets/gallery/doc_image_6.jpeg" alt="Perangkat pelanggan" data-gallery-src="assets/gallery/doc_image_6.jpeg" data-gallery-title="Perangkat Pelanggan">
            <figcaption class="gallery-caption">Perangkat Pelanggan</figcaption>
          </figure>

          <figure class="gallery-item gallery-item-refined" data-gallery-item data-cat="customer" tabindex="0" role="button" aria-label="Buka foto perangkat pelanggan 2">
            <img src="assets/gallery/doc_image_7.jpeg" alt="Perangkat pelanggan" data-gallery-src="assets/gallery/doc_image_7.jpeg" data-gallery-title="Perangkat Pelanggan">
            <figcaption class="gallery-caption">Perangkat Pelanggan</figcaption>
          </figure>
        </div>
      </div>
    </section>
  </main>

  <button class="float-wa" data-float-wa aria-label="WhatsApp">☎</button>
  <div data-site-footer></div>
  <script src="app.js"></script>
</body>
</html>
